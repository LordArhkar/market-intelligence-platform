[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=22.5.0"]
build-backend = "hatchling.build"

[project]
name = "market-intelligence-platform"
version = "0.1.0"
description = "Institutional-grade market intelligence and paper-trading platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "OpenHands AI Agent", email = "openhands@all-hands.dev" }
]
keywords = [
    "trading",
    "market-analysis",
    "paper-trading",
    "quantitative-finance",
    "backtesting"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Data processing
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "pyarrow-hotfix",
    
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    
    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    
    # Caching
    "redis>=5.0.0",
    
    # External data
    "yfinance>=0.2.0",
    "ccxt>=4.3.0",
    "alpaca-trade-api>=3.0.0",
    "ib_insync>=0.9.0",
    
    # Technical analysis
    "ta>=0.10.0",
    # Note: pandas-ta removed - requires numba which doesn't support Python 3.14
    "vectorbt>=0.25.0",
    
    # Configuration
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "hydra-core>=1.3.0",
    
    # Logging and monitoring
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    
    # Utilities
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
    "msgspec>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipython>=8.22.0",
    "jupyter>=1.0.0",
]
dashboard = [
    "dash>=2.16.0",
    "plotly>=5.20.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
mip = "mip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mip"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/mip"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
